<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PREM Predictor – Predictions</title>
<style>
body{font-family:Arial,Helvetica,sans-serif;background:#f4f6f8;color:#213547;margin:0;padding:24px}.wrap{max-width:1200px;margin:auto}h1{text-align:center;color:#0f355e;margin-bottom:6px}.sub{text-align:center;color:#667085;margin:0 0 22px}.status{background:#fff;border:1px solid #e3e7ec;border-radius:14px;box-shadow:0 2px 8px rgba(16,24,40,.06);padding:18px;text-align:center;margin-bottom:22px}.preview-btn{display:inline-block;margin-top:12px;border:0;background:#1469c9;color:#fff;padding:9px 13px;border-radius:8px;font-weight:700;cursor:pointer;text-decoration:none}.preview-note{font-size:12px;color:#667085;margin-top:8px}.fixture-card{background:#fff;border:1px solid #e3e7ec;border-radius:14px;box-shadow:0 2px 8px rgba(16,24,40,.06);overflow:hidden;margin-bottom:22px}.fixture-head{background:#0f355e;color:#fff;padding:16px 18px;text-align:center}.fixture-title{display:flex;align-items:center;justify-content:center;gap:10px;font-size:20px;font-weight:800;flex-wrap:wrap}.fixture-title img,.pick-team img{width:28px;height:28px;object-fit:contain}.fixture-meta{margin-top:6px;font-size:12px;color:#dbe7f3}.result{font-weight:900}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:11px 10px;border-bottom:1px solid #edf0f3;text-align:center}th{background:#eef3f8;color:#294968;font-size:12px}td{font-size:13px}.player{text-align:left;font-weight:800}.pick-team{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;min-height:28px}.points{font-weight:900}.blank{color:#98a2b3}.bonus-section{margin-top:30px}.bonus-section h2{color:#0f355e;margin:0 0 12px}.bonus-card{background:#fff;border:1px solid #e3e7ec;border-radius:14px;box-shadow:0 2px 8px rgba(16,24,40,.06);overflow:hidden}.bonus-card th{background:#0f355e;color:#fff}.empty{padding:22px;text-align:center;color:#667085}.nav{text-align:center;margin-top:22px}.nav a{display:inline-block;text-decoration:none;background:#1469c9;color:#fff;padding:9px 13px;border-radius:8px;font-weight:700;margin:4px}@media(max-width:700px){body{padding:12px}.fixture-title{font-size:17px}th,td{padding:9px 6px;font-size:11px}.fixture-title img,.pick-team img{width:24px;height:24px}}
</style>
</head>
<body>
<main class="wrap">
<h1>PREM Predictor 2026/27</h1>
<p class="sub" id="subtitle">Predictions</p>
<div class="status" id="status">Checking predictions…</div>
<div id="games"></div>
<section class="bonus-section" id="bonusSection" style="display:none">
  <h2>Bonus Points</h2>
  <div class="bonus-card" id="bonusCard"></div>
</section>
<div class="nav"><a href="/">Make predictions</a><a href="/leaderboard.html">View leaderboard</a><a href="/archive.html">Past rounds</a></div>
</main>
<script>
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function splitKickoff(k){
  const parts=String(k||'').split(' – ');
  return {date:parts[0]||'',time:parts[1]||''};
}
function badge(src,name){return src?`<img src="${esc(src)}" alt="${esc(name)} badge">`:''}
function pickDisplay(pick,fixture){
  if(!pick || !pick.winner) return '<span class="blank"></span>';
  if(pick.winner==='Draw') return '<span class="pick-team">Draw</span>';
  const src=pick.winner===fixture.home?fixture.homeBadge:pick.winner===fixture.away?fixture.awayBadge:'';
  return `<span class="pick-team">${badge(src,pick.winner)}${esc(pick.winner)}</span>`;
}
function marginDisplay(pick){
  if(!pick || !pick.winner || pick.winner==='Draw') return '';
  return esc(pick.margin);
}
function previewActual(fixture){
  const diff=Number(fixture.homeScore)-Number(fixture.awayScore);
  return {winner:diff===0?'Draw':diff>0?fixture.home:fixture.away,margin:Math.abs(diff)};
}
function previewMatchPoints(pick,fixture){
  const actual=previewActual(fixture);
  if(!pick || pick.winner!==actual.winner) return 0;
  if(actual.winner==='Draw') return 25;
  const err=Math.abs(Number(pick.margin)-actual.margin);
  if(err===0) return 25;
  return Math.max(10,20-err);
}
function makePreviewData(data){
  const sampleScores=[[27,20],[18,24],[31,26],[20,28],[22,19]];
  const fixtures=(data.fixtures||[]).map((f,i)=>({
    ...f,
    completed:true,
    homeScore:sampleScores[i]?.[0]??24,
    awayScore:sampleScores[i]?.[1]??20
  }));
  const H=i=>fixtures[i]?.home;
  const A=i=>fixtures[i]?.away;
  const presets={
    Luke:[[H(0),7],[A(1),6],[H(2),5],[A(3),8],[H(4),3]],
    Jo:[[H(0),6],[A(1),8],[H(2),2],[A(3),9],[H(4),5]],
    Steve:[[H(0),7],[A(1),6],[A(2),4],[A(3),10],[H(4),3]],
    Deb:[[A(0),4],[A(1),6],[H(2),6],[H(3),4],[H(4),3]],
    Cas:[[H(0),12],[H(1),3],[H(2),5],[A(3),8],[A(4),2]],
    Ash:[['Draw',null],[A(1),10],[H(2),10],['Draw',null],[H(4),1]]
  };
  const predictions=(data.players||[]).map((name,pi)=>{
    const chosen=presets[name]||fixtures.map((f,fi)=>[fi%2===0?f.home:f.away,5+pi+fi]);
    const picks=fixtures.map((f,fi)=>{
      const [winner,margin]=chosen[fi]||[f.home,5];
      const pick={game:f.game,winner,margin};
      return {...pick,points:previewMatchPoints(pick,f)};
    });
    const allFiveCorrect=picks.every((p,fi)=>p.winner===previewActual(fixtures[fi]).winner);
    const matchTotal=picks.reduce((sum,p)=>sum+p.points,0);
    const allFiveBonus=allFiveCorrect?5:0;
    return {player:name,submitted:true,picks,matchTotal,allFiveBonus,basePoints:matchTotal+allFiveBonus};
  });
  const maxBase=Math.max(...predictions.map(p=>p.basePoints));
  const winners=predictions.filter(p=>p.basePoints===maxBase);
  const bonuses=[];
  predictions.forEach(p=>{if(p.allFiveBonus) bonuses.push({player:p.player,type:'All 5 winners correct',points:5});});
  if(winners.length===1) bonuses.push({player:winners[0].player,type:'Round winner',points:10});
  return {...data,locked:false,preview:true,fixtures,predictions,submittedCount:(data.players||[]).length,bonuses,roundWinnerStatus:winners.length===1?'awarded':'tie-needs-rule'};
}
function render(data){
 const status=document.getElementById('status');
 const games=document.getElementById('games');
 document.getElementById('subtitle').textContent=`Round ${data.round} predictions`;
 if(data.preview){
   status.innerHTML=`<strong>Layout preview only</strong><br>All predictions, points, scores and bonuses shown below are sample data, but the scoring is calculated using the real league rules. Real predictions remain locked until ${esc(data.revealAtDisplay)}.<br><a class="preview-btn" href="/predictions.html">Exit preview</a>`;
 }else{
   status.textContent=`Round ${data.round} predictions are now visible. ${data.submittedCount} recognised on-time entr${data.submittedCount===1?'y':'ies'} received.`;
 }
 const byPlayer={}; (data.predictions||[]).forEach(p=>byPlayer[p.player]=p);
 games.innerHTML=(data.fixtures||[]).map(f=>{
   const kt=splitKickoff(f.kickoff);
   const title=f.completed
     ? `${badge(f.homeBadge,f.home)}${esc(f.home)} <span class="result">${f.homeScore}–${f.awayScore}</span> ${esc(f.away)}${badge(f.awayBadge,f.away)}`
     : `${badge(f.homeBadge,f.home)}${esc(f.home)} <span class="result">v</span> ${esc(f.away)}${badge(f.awayBadge,f.away)}`;
   const rows=(data.players||[]).map(name=>{
     const p=byPlayer[name];
     const pick=p?.picks?.find(x=>x.game===f.game)||null;
     let pts='';
     if(!p || !p.submitted) pts='0';
     else if(f.completed) pts=String(pick?.points??0);
     return `<tr><td class="player">${esc(name)}</td><td>${pickDisplay(pick,f)}</td><td>${marginDisplay(pick)}</td><td class="points">${pts}</td></tr>`;
   }).join('');
   return `<section class="fixture-card"><div class="fixture-head"><div class="fixture-title">${title}</div><div class="fixture-meta">${esc(kt.date)} • ${esc(kt.time)}</div></div><div class="table-wrap"><table><thead><tr><th>Player</th><th>Predicted Team</th><th>Predicted Margin</th><th>Points</th></tr></thead><tbody>${rows}</tbody></table></div></section>`;
 }).join('');
 const bonusSection=document.getElementById('bonusSection');
 const bonusCard=document.getElementById('bonusCard');
 bonusSection.style.display='block';
 if(data.bonuses && data.bonuses.length){
   bonusCard.innerHTML=`<div class="table-wrap"><table><thead><tr><th>Player</th><th>Bonus Type</th><th>Points</th></tr></thead><tbody>${data.bonuses.map(b=>`<tr><td class="player">${esc(b.player)}</td><td>${esc(b.type)}</td><td class="points">${esc(b.points)}</td></tr>`).join('')}</tbody></table></div>`;
 }else{
   const msg=data.roundWinnerStatus==='tie-needs-rule'?'Round-winner bonus pending tie rule.':'No bonus points awarded yet.';
   bonusCard.innerHTML=`<div class="empty">${esc(msg)}</div>`;
 }
}
const previewMode=new URLSearchParams(location.search).get('preview')==='1';
fetch('/api/predictions?ts='+Date.now()).then(r=>r.json()).then(data=>{
 const status=document.getElementById('status');
 if(data.error){status.textContent=data.error;return;}
 document.getElementById('subtitle').textContent=`Round ${data.round} predictions`;
 if(data.locked && !previewMode){
   status.innerHTML=`Predictions are locked until <strong>${esc(data.revealAtDisplay)}</strong>.<br>No player predictions are visible before the first fixture kicks off.<br><a class="preview-btn" href="/predictions.html?preview=1">Preview layout with demo data</a><div class="preview-note">The preview contains no real player predictions.</div>`;
   return;
 }
 render(data.locked?makePreviewData(data):data);
}).catch(()=>{document.getElementById('status').textContent='Predictions are temporarily unavailable.'});
</script>
</body>
</html>
